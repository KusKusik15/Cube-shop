<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Cube Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #111; --panel: #1e1e1e; --text: #eee; --accent: #ff4d4d; --border: #333; --green: #28a745; --blue: #00d2ff; --gold: #ffb703;}
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .login-box { max-width: 400px; margin: 100px auto; background: var(--panel); padding: 30px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .login-box h2 { color: var(--accent); margin-bottom: 20px; }
        
        input, textarea, select { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); color: white; border-radius: 5px; margin-bottom: 15px; outline: none; font-family: inherit;}
        input:focus, textarea:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        button:hover { opacity: 0.9; }
        
        #admin-panel { display: none; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;}
        .header h1 { color: var(--accent); font-size: 24px; }
        .logout-btn { background: transparent; border: 1px solid var(--text); width: auto; padding: 8px 15px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px;}
        .panel h3 { margin-bottom: 15px; color: #aaa; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }

        .inv-category { margin-bottom: 20px; }
        .inv-category-title { color: var(--blue); font-weight: bold; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .inv-card { background: #000; padding: 10px; border-radius: 5px; text-align: center; border: 1px solid #222;}
        .inv-card-name { font-size: 12px; margin-bottom: 8px; color: #ccc; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold;}
        
        .inv-control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; gap: 5px;}
        .inv-control-row span { font-size: 10px; color: #888; width: 25px; text-align: left;}
        
        .inv-controls { display: flex; justify-content: center; align-items: center; gap: 5px; flex-grow: 1;}
        .inv-controls button { width: 25px; padding: 5px 0; background: #222; color: white; border: 1px solid #444; font-size: 14px;}
        .inv-controls input { width: 40px; padding: 5px; margin-bottom: 0; text-align: center; border: 1px solid #444;}
        .inv-controls input.price-input { color: #ffb703; border-color: #553300;}

        .order-item { background: #000; padding: 15px; border-radius: 5px; margin-bottom: 10px; font-size: 14px; border-left: 3px solid var(--accent); display: flex; justify-content: space-between; align-items: center; gap: 10px;}
        .order-info { flex-grow: 1; }
        .btn-complete { background: var(--green); width: auto; padding: 8px 15px; font-size: 12px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; color: white;}
        
        .user-admin-item { background: #000; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #222;}
        .user-admin-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;}
        .user-admin-name { font-weight: bold; font-size: 14px; }
        .user-admin-info { font-size: 11px; color: #888;}
        .role-select { width: auto; margin-bottom: 0; padding: 5px; font-size: 12px;}
        .user-actions { display: flex; gap: 5px; flex-wrap: wrap; align-items: center;}
        .btn-mini { padding: 5px 10px; font-size: 11px; width: auto; }
        .btn-mute { background: #ffb703; color: #000; }
        .btn-ban { background: #ff4d4d; color: #fff; }
        .btn-unban { background: #28a745; color: #fff; }
        .btn-unmute { background: #00d2ff; color: #000; }

        .mute-select { width: auto; margin-bottom: 0; padding: 5px; font-size: 12px; flex-grow: 1; min-width: 120px;}
        .mute-custom { width: 60px; margin-bottom: 0; padding: 5px; font-size: 12px; text-align: center;}

        .mute-info { font-size: 11px; color: #ffb703; display: flex; flex-direction: column; gap: 2px;}
        .ban-info { font-size: 11px; color: #ff4d4d; }

        .news-admin-item { background: #000; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 2px solid var(--blue); }
        .news-admin-item.pinned { border-left-color: var(--gold); background: #111a11; }
        .news-admin-date { font-size: 11px; color: #888; margin-bottom: 5px; display: flex; justify-content: space-between;}
        .news-admin-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .news-admin-content { font-size: 12px; color: #aaa; margin-bottom: 10px; white-space: pre-wrap; max-height: 60px; overflow-y: auto;}
        .news-btns { display: flex; gap: 5px; flex-wrap: wrap; }
        .news-btns button { width: auto; padding: 5px 10px; font-size: 11px;}

        .chat-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;}
        .chat-tab { background: #000; border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; width: auto; position: relative; display: flex; align-items: center; gap: 6px;}
        .chat-tab.active { background: var(--blue); color: #000; border-color: var(--blue); font-weight: bold;}
        .chat-tab .tab-badge { background: #ff4d4d; color: white; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center; display: none; }
        
        .chat-layout { display: grid; grid-template-columns: 250px 1fr; gap: 15px; height: 500px; }
        .user-list { background: #000; border-radius: 5px; overflow-y: auto; border: 1px solid var(--border); }
        .user-item { padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;}
        .user-item:hover, .user-item.active { background: #222; color: var(--blue); }
        .user-item .user-badge { background: #ff4d4d; color: white; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center; display: none;}
        
        .chat-area { display: flex; flex-direction: column; background: #000; border-radius: 5px; border: 1px solid var(--border); padding: 15px; }
        .messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .msg { padding: 10px; border-radius: 5px; max-width: 80%; font-size: 14px; }
        .msg.user { background: #333; align-self: flex-start; }
        .msg.admin { background: var(--blue); color: #000; align-self: flex-end; }
        
        .gc-msg { padding: 10px; border-radius: 5px; background: #111; border-left: 3px solid #333; display: flex; justify-content: space-between; gap: 10px; position: relative; group: msg;}
        .gc-msg.role-owner { border-left-color: var(--gold); background: rgba(255, 183, 3, 0.05);}
        .gc-msg.role-moder { border-left-color: var(--accent); background: rgba(255, 77, 77, 0.05);}
        .gc-msg.role-tester { border-left-color: var(--blue); background: rgba(0, 210, 255, 0.05);}
        .gc-msg.system-msg { border-left: none; background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); justify-content: center; text-align: center;}
        .gc-text { font-size: 14px; }
        .gc-header-info { font-size: 11px; color: #888; margin-bottom: 3px; display: flex; gap: 10px; align-items: center;}
        .gc-name { font-weight: bold; color: #fff;}
        .btn-del-msg { background: transparent; color: #ff4d4d; border: none; font-size: 18px; cursor: pointer; width: auto; padding: 0 5px;}
        
        .gc-reply-quote { background: rgba(0,0,0,0.3); border-left: 3px solid #888; padding: 5px 10px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; color: #aaa; }
        .gc-reply-quote b { color: var(--blue); }

        .gc-actions { display: none; gap: 10px; position: absolute; top: -12px; right: 10px; background: #000; padding: 3px 8px; border-radius: 6px; border: 1px solid #333; }
        .gc-msg:hover .gc-actions { display: flex; }
        .gc-actions button { background: transparent; border: none; cursor: pointer; font-size: 14px; color: #888; padding: 0; }
        .gc-actions button:hover { color: var(--blue); }

        .pass-wrapper { position: relative; margin-bottom: 15px; }
        .pass-wrapper input { margin-bottom: 0; padding-right: 40px; }
        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 20px; }

        /* Команда */
        .team-admin-list { display: flex; flex-direction: column; gap: 10px; }
        .team-admin-item { display: flex; align-items: center; justify-content: space-between; background: #000; padding: 10px; border-radius: 5px; border-left: 3px solid var(--blue);}
        .team-admin-info { font-size: 14px; font-weight: bold;}
        .team-admin-role { font-size: 11px; color: #888; text-transform: uppercase;}

        /* МОДАЛЬНЫЕ ОКНА */
        .admin-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9000;
            backdrop-filter: blur(4px);
        }
        .admin-modal-overlay.show { display: flex; }
        .admin-modal {
            background: var(--panel);
            border: 1px solid var(--blue);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.2);
            animation: modalIn 0.25s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .admin-modal h3 { color: var(--blue); margin-bottom: 15px; font-size: 22px; }
        .admin-modal p { color: #ccc; margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
        .admin-modal b { color: #fff; }
        .admin-modal .role-highlight { color: var(--gold); font-weight: 800; }
        .admin-modal textarea { width: 100%; margin-bottom: 15px; }
        .admin-modal-btns { display: flex; gap: 10px; }
        .admin-modal-btns button { flex: 1; padding: 12px; font-size: 14px; }
        .admin-modal-btns .btn-cancel-modal { background: transparent; border: 1px solid #666; color: #aaa; }
        .admin-modal-btns .btn-confirm-modal { background: var(--green); }
        .admin-modal-btns .btn-confirm-danger { background: var(--accent); }

        @media (max-width: 800px) {
            body { padding: 10px; }
            .grid { grid-template-columns: 1fr; }
            .inv-grid { grid-template-columns: 1fr; }
            .chat-layout { grid-template-columns: 1fr; height: auto; }
            .user-list { height: 150px; }
            .chat-area { height: 400px; }
            .header h1 { font-size: 20px; }
            .panel { padding: 15px; }
            .order-item { flex-direction: column; align-items: flex-start; }
            .btn-complete { width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="login-box" id="login-box">
        <h2>Вход в Админку</h2>
        <div class="pass-wrapper">
            <input type="password" id="pass-input" placeholder="Пароль (admin)" onkeypress="if(event.key === 'Enter') login()">
            <span onclick="togglePassword()" class="eye-icon" id="eye-icon">👁️</span>
        </div>
        <button onclick="login()">Войти</button>
    </div>

    <div id="admin-panel">
        <div class="header">
            <h1>🚨 Админ Панель</h1>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="grid">
            <div class="panel">
                <h3>Товары (Кол-во и Цена)</h3>
                <div id="inventory-list" style="max-height: 600px; overflow-y: auto; padding-right: 10px;"></div>
                <button onclick="saveInventory()" style="margin-top: 15px;">Сохранить всё</button>
            </div>

            <div style="display: flex; flex-direction: column;">
                <div class="panel">
                    <h3 id="news-form-title">Добавить новость</h3>
                    <input type="hidden" id="edit-news-id">
                    <input type="text" id="news-title" placeholder="Заголовок">
                    <textarea id="news-content" rows="3" placeholder="Текст новости..."></textarea>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="saveNews()" style="background: var(--blue); color: #000;" id="news-submit-btn">Опубликовать</button>
                        <button onclick="cancelEdit()" id="news-cancel-btn" style="background: #555; display: none;">Отмена</button>
                    </div>
                    
                    <div id="news-list" style="margin-top: 15px; max-height: 250px; overflow-y: auto; padding-right: 5px;"></div>
                </div>
                
                <div class="panel">
                    <h3>Пользователи и Роли</h3>
                    <div id="users-list" style="max-height: 400px; overflow-y: auto;"></div>
                </div>

                <div class="panel">
                    <h3>👥 Команда проекта</h3>
                    <div id="team-admin-list" class="team-admin-list"></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>Заказы</h3>
            <div id="orders-list" style="max-height: 300px; overflow-y: auto;"></div>
        </div>

        <div class="panel" style="margin-top: 20px;">
            <h3>Чаты</h3>
            <div class="chat-tabs">
                <button class="chat-tab active" id="tab-seller" onclick="switchChatTab('seller')">
                    📦 Выдача заказов <span class="tab-badge" id="tab-badge-seller">0</span>
                </button>
                <button class="chat-tab" id="tab-support" onclick="switchChatTab('support')">
                    🆘 Тех. Поддержка <span class="tab-badge" id="tab-badge-support">0</span>
                </button>
                <button class="chat-tab" id="tab-global" onclick="switchChatTab('global')">
                    🗣️ Общий чат <span class="tab-badge" id="tab-badge-global">0</span>
                </button>
            </div>
            
            <div class="chat-layout" id="private-chats-layout">
                <div class="user-list" id="chat-users"></div>
                <div class="chat-area">
                    <div class="messages" id="chat-messages"><div style="color: #666; text-align: center; margin-top: 50px;">Выберите пользователя</div></div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="admin-reply-input" placeholder="Ответ..." onkeypress="if(event.key === 'Enter') sendReply()">
                        <button onclick="sendReply()" style="width: 100px;">➤</button>
                    </div>
                </div>
            </div>

            <div id="global-chat-layout" style="display: none; flex-direction: column; height: 500px;">
                <div class="messages" id="admin-gc-box" style="background: #000; border: 1px solid var(--border); padding: 15px; border-radius: 5px; margin-bottom: 15px;"></div>
                <div class="gc-reply-preview" id="gc-reply-preview" style="margin-bottom: 5px; border-radius: 5px; border: 1px solid #333; display: none; padding: 10px; justify-content: space-between; align-items: center;">
                    <span id="gc-reply-text" style="font-size: 12px; color: #888;"></span>
                    <button onclick="cancelReply()" style="width: auto; padding: 2px 8px; background: #ff4d4d; color: white; font-size: 10px;">X</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="admin-gc-input" placeholder="Написать в общий чат (от лица KusKusik15)..." onkeypress="if(event.key === 'Enter') sendGlobalAdminMsg()">
                    <button onclick="sendGlobalAdminMsg()" style="width: 100px; background: var(--gold); color: #000;">➤</button>
                </div>
            </div>
            
        </div>
    </div>

    <!-- МОДАЛКА СМЕНЫ РОЛИ -->
    <div class="admin-modal-overlay" id="roleConfirmModal">
        <div class="admin-modal">
            <h3>Смена роли</h3>
            <p id="role-confirm-text"></p>
            <div class="admin-modal-btns">
                <button class="btn-cancel-modal" onclick="cancelRoleChange()">Отмена</button>
                <button class="btn-confirm-modal" onclick="confirmRoleChange()">Подтвердить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА МУТА -->
    <div class="admin-modal-overlay" id="muteModal">
        <div class="admin-modal">
            <h3>🔇 Замутить игрока</h3>
            <p id="mute-confirm-text"></p>
            <textarea id="mute-reason-input" rows="2" placeholder="Причина мута (необязательно)"></textarea>
            <div class="admin-modal-btns">
                <button class="btn-cancel-modal" onclick="cancelMute()">Отмена</button>
                <button class="btn-confirm-modal" onclick="confirmMute()">Замутить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА БАНА -->
    <div class="admin-modal-overlay" id="banModal">
        <div class="admin-modal">
            <h3>🚫 Забанить игрока</h3>
            <p id="ban-confirm-text"></p>
            <textarea id="ban-reason-input" rows="2" placeholder="Причина бана (необязательно)"></textarea>
            <div class="admin-modal-btns">
                <button class="btn-cancel-modal" onclick="cancelBan()">Отмена</button>
                <button class="btn-confirm-danger" onclick="confirmBan()">Забанить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ СООБЩЕНИЯ -->
    <div class="admin-modal-overlay" id="editMsgModal">
        <div class="admin-modal">
            <h3>✏️ Редактировать сообщение</h3>
            <textarea id="edit-msg-text" rows="3"></textarea>
            <div class="admin-modal-btns">
                <button class="btn-cancel-modal" onclick="document.getElementById('editMsgModal').classList.remove('show')">Отмена</button>
                <button class="btn-confirm-modal" onclick="saveEditedMsg()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        const itemDatabase = {
            'Дамасс': { 'damass': 'Дамасский слиток' },
            'Сталь': { 'steel': 'Стальной слиток' },
            'Железо': { 'iron': 'Железный слиток' },
            'Золото': { 'gold': 'Золотой слиток' },
            'Медь': { 'copper': 'Медный слиток' },
            'Бронза': { 'bronze': 'Бронзовый слиток' },
            'Броня (Нашлемник)': { 'helmet_damass': 'Дамасский шлем', 'helmet_copper': 'Медный шлем' },
            'Броня (Нагрудник)': { 'chestplate_damass': 'Дамасский нагрудник', 'copper': 'Медный нагрудник' },
            'Броня (Штаны)': { 'leggings_damass': 'Дамасские штаны' },
            'Броня (Сапоги)': { 'boots_damass': 'Дамасские сапоги' },
            'Инструменты': { 'sword': 'Железный меч', 'axe': 'Железный топор', 'pickaxe': 'Железная кирка', 'shovel': 'Лопата', 'spear': 'Копьё', 'mace': 'Булава', 'fishing_rod': 'Удочка' },
            'Еда': { 'apple': 'Яблоко', 'bread': 'Хлеб' },
            'Взрывчатка': { 'tnt': 'Динамит' },
            'Сырьё': { 'cobble': 'Стак Булыжника', 'wood': 'Древесина' },
            'Интерьер': { 'table': 'Стол', 'chair': 'Стул' }
        };

        function getItemName(id) {
            for (const category in itemDatabase) {
                if (itemDatabase[category][id]) return itemDatabase[category][id];
            }
            return id;
        }

        let adminData = null, currentChatUser = null, currentChatType = 'seller', isUpdating = false;
        let loadDataTimerId = null;
        let pendingRoleChange = null;
        let pendingMute = null;
        let pendingBan = null;
        let lastGlobalId = null;

        // Для ответов и редактирования
        let replyToId = null;
        let editingMsgId = null;

        let seenAdmin = { seller: 0, support: 0, global: 0, users: {} };
        function loadSeenAdmin() {
            try {
                const stored = JSON.parse(localStorage.getItem('cubeShopAdminSeen') || '{}');
                seenAdmin = { seller: stored.seller || 0, support: stored.support || 0, global: stored.global || 0, users: stored.users || {} };
            } catch(e) {}
        }
        function saveSeenAdmin() {
            try { localStorage.setItem('cubeShopAdminSeen', JSON.stringify(seenAdmin)); } catch(e) {}
        }

        function togglePassword() { const i = document.getElementById('pass-input'); i.type = i.type === 'password' ? 'text' : 'password'; }

        window.onload = async () => {
            loadSeenAdmin();
            const res = await fetch('/api/admin/check'); const data = await res.json();
            if (data.isAdmin) { document.getElementById('login-box').style.display = 'none'; document.getElementById('admin-panel').style.display = 'block'; loadData(); }
        };

        async function login() {
            const res = await fetch('/api/admin/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: document.getElementById('pass-input').value }) });
            if (res.ok) { document.getElementById('login-box').style.display = 'none'; document.getElementById('admin-panel').style.display = 'block'; loadData(); } else { alert('Неверный пароль!'); }
        }
        async function logout() { 
            if (loadDataTimerId) { clearTimeout(loadDataTimerId); loadDataTimerId = null; }
            await fetch('/api/admin/logout', { method: 'POST' }); 
            window.location.reload(); 
        }

        function isFocusInside(elId) {
            const el = document.getElementById(elId);
            if (!el) return false;
            const active = document.activeElement;
            return el.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
        }

        async function loadData() {
            if (isUpdating) return; isUpdating = true;
            try {
                const res = await fetch('/api/admin/data');
                if (res.ok) { 
                    adminData = await res.json(); 
                    if (!adminData.prices) adminData.prices = {};
                    if (!isFocusInside('inventory-list')) renderInventory();
                    if (!isFocusInside('orders-list')) renderOrders();
                    if (!isFocusInside('news-list') && !isFocusInside('news-title') && !isFocusInside('news-content')) renderNews();
                    if (!isFocusInside('users-list') && !document.querySelector('.admin-modal-overlay.show')) renderUsers();
                    
                    renderTeamAdmin();

                    if(currentChatType === 'global') {
                        if (!isFocusInside('admin-gc-input') && !isFocusInside('edit-msg-text')) renderGlobalAdminChat();
                    } else {
                        if (!isFocusInside('chat-users') && !isFocusInside('chat-messages') && !isFocusInside('admin-reply-input')) {
                            renderChatUsers(); 
                            if (currentChatUser) openChat(currentChatUser);
                        }
                    }
                    
                    updateChatBadges();
                }
            } catch (e) {} finally { 
                isUpdating = false; 
                loadDataTimerId = setTimeout(loadData, 5000); 
            }
        }

        // --- КОМАНДА В АДМИНКЕ ---
        function renderTeamAdmin() {
            const list = document.getElementById('team-admin-list');
            if (!adminData.users) return;
            
            const team = adminData.users.filter(u => u.role && u.role !== 'user');
            if (team.length === 0) { list.innerHTML = '<div style="color: #666;">В команде пока никого нет</div>'; return; }
            
            const roleNames = { owner: '👑 Владелец', moder: '🛡️ Модератор', tester: '🧪 Тестер' };
            
            list.innerHTML = team.map(u => `
                <div class="team-admin-item">
                    <div class="team-admin-info">${esc(u.name)}</div>
                    <div class="team-admin-role">${roleNames[u.role] || u.role}</div>
                </div>
            `).join('');
        }

        function updateChatBadges() {
            if (!adminData) return;
            
            const sellerCount = adminData.messages.filter(m => m.type === 'seller').length;
            const supportCount = adminData.messages.filter(m => m.type === 'support').length;
            const globalCount = adminData.globalChat.length;
            
            const sellerUnread = Math.max(0, sellerCount - seenAdmin.seller);
            const supportUnread = Math.max(0, supportCount - seenAdmin.support);
            const globalUnread = Math.max(0, globalCount - seenAdmin.global);
            
            const bs = document.getElementById('tab-badge-seller');
            const bp = document.getElementById('tab-badge-support');
            const bg = document.getElementById('tab-badge-global');
            
            if (sellerUnread > 0) { bs.innerText = sellerUnread; bs.style.display = 'inline-block'; } else bs.style.display = 'none';
            if (supportUnread > 0) { bp.innerText = supportUnread; bp.style.display = 'inline-block'; } else bp.style.display = 'none';
            if (globalUnread > 0) { bg.innerText = globalUnread; bg.style.display = 'inline-block'; } else bg.style.display = 'none';
        }

        function markAdminTabSeen(type) {
            if (!adminData) return;
            if (type === 'global') {
                seenAdmin.global = adminData.globalChat.length;
            } else {
                seenAdmin[type] = adminData.messages.filter(m => m.type === type).length;
            }
            saveSeenAdmin();
            updateChatBadges();
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list'); list.innerHTML = '';
            for (const [category, items] of Object.entries(itemDatabase)) {
                let categoryHtml = `<div class="inv-category"><div class="inv-category-title">${category}</div><div class="inv-grid">`;
                for (const [id, name] of Object.entries(items)) {
                    let val = adminData.inventory[id] !== undefined ? adminData.inventory[id] : 0;
                    let price = adminData.prices[id] !== undefined ? adminData.prices[id] : 0;
                    
                    categoryHtml += `
                        <div class="inv-card">
                            <div class="inv-card-name">${name}</div>
                            <div class="inv-control-row">
                                <span>Кол-во:</span>
                                <div class="inv-controls">
                                    <button onclick="changeInv('${id}', -1)">-</button>
                                    <input type="number" id="inv-${id}" value="${val}" min="0">
                                    <button onclick="changeInv('${id}', 1)">+</button>
                                </div>
                            </div>
                            <div class="inv-control-row">
                                <span>Цена:</span>
                                <div class="inv-controls">
                                    <button onclick="changePrice('${id}', -1)">-</button>
                                    <input type="number" class="price-input" id="price-${id}" value="${price}" min="0" placeholder="0">
                                    <button onclick="changePrice('${id}', 1)">+</button>
                                </div>
                            </div>
                        </div>`;
                }
                categoryHtml += `</div></div>`;
                list.innerHTML += categoryHtml;
            }
        }

        function changeInv(id, change) {
            const input = document.getElementById(`inv-${id}`);
            let val = parseInt(input.value) || 0;
            val += change; if (val < 0) val = 0; input.value = val;
        }

        function changePrice(id, change) {
            const input = document.getElementById(`price-${id}`);
            let val = parseInt(input.value) || 0;
            val += change; if (val < 0) val = 0; input.value = val;
        }

        async function saveInventory() {
            let newInv = {}; let newPrices = {};
            document.querySelectorAll('#inventory-list input[id^="inv-"]').forEach(input => { newInv[input.id.replace('inv-', '')] = parseInt(input.value) || 0; });
            document.querySelectorAll('#inventory-list input[id^="price-"]').forEach(input => { newPrices[input.id.replace('price-', '')] = parseInt(input.value) || 0; });

            const res = await fetch('/api/admin/inventory', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ inventory: newInv, prices: newPrices }) });
            if(res.ok) alert('Товары и цены сохранены!');
            else alert('Ошибка при сохранении');
        }

        function renderUsers() {
            const list = document.getElementById('users-list'); list.innerHTML = '';
            if (!adminData.users) return;
            
            adminData.users.forEach(u => {
                let actionBtns = '';
                if (u.isBanned) {
                    actionBtns = `<button class="btn-mini btn-unban" onclick="chatAction('${u.id}', 'unban')">Разбанить</button>`;
                } else {
                    let muteControls = '';
                    if (u.isMuted) {
                        const until = u.mutedUntil ? new Date(u.mutedUntil).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
                        muteControls = `
                            <button class="btn-mini btn-unmute" onclick="chatAction('${u.id}', 'unmute')">Снять мут</button>
                            <div class="mute-info">
                                <span>Мут до: ${until}</span>
                                ${u.muteReason ? `<span>Причина: ${esc(u.muteReason)}</span>` : ''}

                    } else {
                        muteControls = `
                            <select class="mute-select" id="mute-time-${u.id}">
                                <option value="30">30 минут</option>
                                <option value="60">1 час</option>
                                <option value="360">6 часов</option>
                                <option value="1440">1 день</option>
                                <option value="10080">7 дней</option>
                                <option value="43200">30 дней</option>
                                <option value="525600">365 дней</option>
                                <option value="custom">Своё...</option>
                            </select>
                            <input type="number" class="mute-custom" id="mute-custom-${u.id}" placeholder="мин" min="1" max="525600" style="display: none;">
                            <button class="btn-mini btn-mute" onclick="openMuteModal('${u.id}')">Мут</button>
                        `;
                    }
                    actionBtns = `${muteControls}<button class="btn-mini btn-ban" onclick="openBanModal('${u.id}')">Бан</button>`;
                }

                let roleLabel = u.role === 'owner' ? '👑 Владелец' : (u.role === 'moder' ? '🛡️ Модер' : (u.role === 'tester' ? '🧪 Тестер' : '👤 Игрок'));

                let banInfoHtml = '';
                if (u.isBanned && u.banReason) {
                    banInfoHtml = `<div class="ban-info">Причина бана: ${esc(u.banReason)}</div>`;

                list.innerHTML += `
                    <div class="user-admin-item">
                        <div class="user-admin-row">
                            <span class="user-admin-name">${esc(u.name)}</span>

                        </div>
                        ${banInfoHtml}
                        <div class="user-admin-row">
                            <select class="role-select" onchange="changeRole('${u.id}', this.value, this)">
                                <option value="user" ${u.role === 'user' ? 'selected' : ''}>Игрок</option>
                                <option value="tester" ${u.role === 'tester' ? 'selected' : ''}>Тестер</option>
                                <option value="moder" ${u.role === 'moder' ? 'selected' : ''}>Модер</option>
                                <option value="owner" ${u.role === 'owner' ? 'selected' : ''}>Владелец</option>
                            </select>
                        </div>
                        <div class="user-actions">${actionBtns}</div>
                    </div>
                `;
            });

            document.querySelectorAll('.mute-select').forEach(sel => {
                sel.addEventListener('change', function() {
                    const userId = this.id.replace('mute-time-', '');
                    const customInput = document.getElementById(`mute-custom-${userId}`);
                    if (this.value === 'custom') customInput.style.display = 'inline-block';
                    else customInput.style.display = 'none';
                });
            });
        }

        function openMuteModal(userId) {
            const user = adminData.users.find(u => u.id === userId);
            if (!user) return;
            
            const sel = document.getElementById(`mute-time-${userId}`);
            let minutes = sel.value;
            let timeLabel = '';
            
            if (minutes === 'custom') {
                const custom = document.getElementById(`mute-custom-${userId}`);
                minutes = parseInt(custom.value);
                if (!minutes || minutes < 1) return alert('Введите количество минут (минимум 1)');
                if (minutes > 525600) minutes = 525600;
                timeLabel = `${minutes} минут`;
            } else {
                timeLabel = sel.options[sel.selectedIndex].text;
            }
            
            pendingMute = { userId, minutes: parseInt(minutes) };
            
            document.getElementById('mute-confirm-text').innerHTML = 
                `Замутить игрока <b>${esc(user.name)}</b> на <b>${timeLabel}</b>?`;
            document.getElementById('mute-reason-input').value = '';
            document.getElementById('muteModal').classList.add('show');
        }

        function cancelMute() {
            document.getElementById('muteModal').classList.remove('show');
            pendingMute = null;
        }

        async function confirmMute() {
            if (!pendingMute) return;
            const reason = document.getElementById('mute-reason-input').value.trim();
            document.getElementById('muteModal').classList.remove('show');
            
            await chatAction(pendingMute.userId, 'mute', pendingMute.minutes, reason);
            pendingMute = null;
        }

        function openBanModal(userId) {
            const user = adminData.users.find(u => u.id === userId);
            if (!user) return;
            
            pendingBan = { userId };
            
            document.getElementById('ban-confirm-text').innerHTML = 
                `Забанить игрока <b>${esc(user.name)}</b>? Он не сможет писать в чат.`;
            document.getElementById('ban-reason-input').value = '';
            document.getElementById('banModal').classList.add('show');
        }

        function cancelBan() {
            document.getElementById('banModal').classList.remove('show');
            pendingBan = null;
        }

        async function confirmBan() {
            if (!pendingBan) return;
            const reason = document.getElementById('ban-reason-input').value.trim();
            document.getElementById('banModal').classList.remove('show');
            
            await chatAction(pendingBan.userId, 'ban', 0, reason);
            pendingBan = null;
        }

        function changeRole(userId, newRole, selectEl) {
            const user = adminData.users.find(u => u.id === userId);
            const roleNames = { user: 'Игрок', tester: 'Тестер', moder: 'Модер', owner: 'Владелец' };
            pendingRoleChange = { userId, newRole, selectEl, oldRole: user ? user.role : 'user' };
            
            document.getElementById('role-confirm-text').innerHTML = 
                `Выдать игроку <b>${esc(user ? user.name : 'Неизвестный')}</b> роль <span class="role-highlight">${roleNames[newRole] || newRole}</span>?`;
            document.getElementById('roleConfirmModal').classList.add('show');
        }

        function cancelRoleChange() {
            document.getElementById('roleConfirmModal').classList.remove('show');
            if (pendingRoleChange && pendingRoleChange.selectEl) {
                pendingRoleChange.selectEl.value = pendingRoleChange.oldRole;
            }
            pendingRoleChange = null;
        }

        async function confirmRoleChange() {
            if (!pendingRoleChange) return;
            const { userId, newRole } = pendingRoleChange;
            document.getElementById('roleConfirmModal').classList.remove('show');
            pendingRoleChange = null;
            
            try {
                const res = await fetch('/api/admin/set-role', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ userId, role: newRole }) 
                });
                if (!res.ok) { alert('Не удалось изменить роль (ошибка сервера)'); loadData(); }
                else { loadData(); }
            } catch (e) {
                alert('Ошибка сети: ' + e.message);
                loadData();
            }
        }

        async function chatAction(userId, action, minutes = 0, reason = '') {
            try {
                const res = await fetch('/api/admin/chat-action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId, action, minutes, reason }) });
                if (!res.ok) alert('Ошибка действия: ' + res.status);
                loadData();
            } catch (e) { alert('Ошибка сети: ' + e.message); }
        }

            if (!adminData.news) return;
            adminData.news.forEach(n => {
                list.innerHTML += `
                <div class="news-admin-item ${n.pinned ? 'pinned' : ''}">

                    <div class="news-admin-title">${esc(n.title)}</div>

        async function saveNews() {
            const id = document.getElementById('edit-news-id').value;

            const content = document.getElementById('news-content').value;
            if (!title || !content) return alert('Заполните заголовок и текст!');

            const body = id ? { id, title, content } : { title, content };
            await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });

        }
        function editNews(id) {
            const newsItem = adminData.news.find(n => n.id === id); if (!newsItem) return;
            document.getElementById('edit-news-id').value = newsItem.id;
            document.getElementById('news-title').value = newsItem.title;
            document.getElementById('news-content').value = newsItem.content;
            document.getElementById('news-form-title').innerText = 'Редактировать новость';
            document.getElementById('news-submit-btn').innerText = 'Сохранить изменения';
            document.getElementById('news-cancel-btn').style.display = 'block';
            window.scrollTo(0, 0);

            document.getElementById('edit-news-id').value = ''; document.getElementById('news-title').value = '';
            document.getElementById('news-content').value = ''; document.getElementById('news-form-title').innerText = 'Добавить новость';
            document.getElementById('news-submit-btn').innerText = 'Опубликовать'; document.getElementById('news-cancel-btn').style.display = 'none';

        async function deleteNews(id) { if(!confirm('Удалить новость?')) return; await fetch('/api/admin/news/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id }) }); loadData(); }

        function renderOrders() {
            const list = document.getElementById('orders-list');
            if (!adminData.orders || adminData.orders.length === 0) { list.innerHTML = '<div style="color:#666">Нет заказов</div>'; return; }
            
            const recentOrders = [...adminData.orders].reverse().slice(0, 20);
            let html = '';
            
            recentOrders.forEach(o => {
                const user = adminData.users.find(u => u.id === o.userId);
                const displayNick = user ? user.name : 'Неизвестный';
                const isPending = o.status === 'pending';
                const productName = getItemName(o.itemId); 
                
                let btnHtml = isPending ? `<button class="btn-complete" onclick="completeOrder('${o.id}', this)">Выдать</button>` : '';
                
                let statusHtml = '';
                if (o.status === 'pending') statusHtml = `<span style="color:#ffb703">Ожидает выдачи</span>`;
                else if (o.status === 'delivered') statusHtml = `<span style="color:#00d2ff">Выдан</span>`;
                else if (o.status === 'completed') statusHtml = `<span style="color:#00ff88">Завершен</span>`;
                else if (o.status === 'dispute') statusHtml = `<span style="color:#ff4d4d">Спор (Не получен)</span>`;
                else if (o.status === 'cancelled_by_user') statusHtml = `<span style="color:#888">Отменен игроком (по желанию)</span>`;
                else if (o.status === 'cancelled_by_dispute') statusHtml = `<span style="color:#ff4d4d">Отменен (Спор не решен)</span>`;

                html += `<div class="order-item" style="${isPending ? '' : 'opacity: 0.8;'} ${o.status === 'dispute' || o.status === 'cancelled_by_dispute' ? 'border-left-color: #ff4d4d;' : ''}">
                    <div class="order-info"><b>${esc(displayNick)}</b> купил <b>${esc(productName)}</b> (x${o.qty})<br>Ник: <b style="color: #fff;">${esc(o.buyerNick)}</b><br>${statusHtml}</div>${btnHtml}</div>`;
            });
            list.innerHTML = html;
        }

        async function completeOrder(id, btn) {
            if (!confirm('Выдали товар?')) return; btn.disabled = true; btn.innerText = '...';
            try {
                const res = await fetch('/api/admin/complete-order', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ orderId: id }) });
                if (res.ok) await loadData(); 
                else { alert('Ошибка: ' + res.status); btn.disabled = false; btn.innerText = 'Выдать'; }
            } catch (e) { alert('Ошибка сети: ' + e.message); btn.disabled = false; btn.innerText = 'Выдать'; }
        }

        function switchChatTab(type) {
            currentChatType = type;
            document.getElementById('tab-seller').classList.remove('active'); 
            document.getElementById('tab-support').classList.remove('active');
            document.getElementById('tab-global').classList.remove('active');
            document.getElementById('tab-' + type).classList.add('active');
            
            markAdminTabSeen(type);
            
            if (type === 'global') {
                document.getElementById('private-chats-layout').style.display = 'none';
                document.getElementById('global-chat-layout').style.display = 'flex';
                renderGlobalAdminChat(true);
            } else {
                document.getElementById('private-chats-layout').style.display = 'grid';
                document.getElementById('global-chat-layout').style.display = 'none';
                currentChatUser = null; document.getElementById('chat-messages').innerHTML = '<div style="color: #666; text-align: center; margin-top: 50px;">Выберите пользователя</div>';
                renderChatUsers();
            }
        }

        function renderChatUsers() {
            const list = document.getElementById('chat-users'); list.innerHTML = '';
            const usersWithMsgs = [...new Set(adminData.messages.filter(m => m.type === currentChatType).map(m => m.userId))];
            if (usersWithMsgs.length === 0) { list.innerHTML = '<div style="padding: 15px; color: #666;">Нет сообщений</div>'; return; }

            usersWithMsgs.forEach(userId => {
                const user = adminData.users.find(u => u.id === userId);
                if (user) {
                    const userMsgsCount = adminData.messages.filter(m => m.userId === userId && m.type === currentChatType).length;
                    const seen = seenAdmin.users[userId + '_' + currentChatType] || 0;
                    const unread = Math.max(0, userMsgsCount - seen);
                    
                    const div = document.createElement('div');
                    div.className = `user-item ${currentChatUser === userId ? 'active' : ''}`;
                    div.innerHTML = `<span>${esc(user.name)}</span><span class="user-badge" data-userid="${userId}">${unread}</span>`;
                    if (unread > 0) div.querySelector('.user-badge').style.display = 'inline-block';
                    div.onclick = () => openChat(userId);
                    list.appendChild(div);
                }
            });
        }

        function openChat(userId) {
            currentChatUser = userId; 
            const count = adminData.messages.filter(m => m.userId === userId && m.type === currentChatType).length;
            seenAdmin.users[userId + '_' + currentChatType] = count;
            saveSeenAdmin();
            
            renderChatUsers();
            const msgBox = document.getElementById('chat-messages'); msgBox.innerHTML = '';
            const userMsgs = adminData.messages.filter(m => m.userId === userId && m.type === currentChatType);
            userMsgs.forEach(m => { msgBox.innerHTML += `<div class="msg ${m.sender}">${esc(m.text)}</div>`; });
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        async function sendReply() {
            if (!currentChatUser) return alert('Выберите пользователя!');
            const input = document.getElementById('admin-reply-input'); const text = input.value.trim(); if (!text) return;
            try {
                const res = await fetch('/api/admin/reply', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: currentChatUser, text: text, type: currentChatType }) });
                if (!res.ok) { alert('Ошибка отправки: ' + res.status); return; }
                input.value = ''; loadData(); 
            } catch (e) { alert('Ошибка сети: ' + e.message); }
        }

            const res = await fetch('/api/admin/global-chat/edit', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ msgId: editingMsgId, text: text })

        function copyMsgText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Текст скопирован');
            });
        }

        function renderGlobalAdminChat(forceReload = false) {
            const box = document.getElementById('admin-gc-box');
            if (!adminData.globalChat) return;
            
            const currentLastId = adminData.globalChat.length > 0 
                ? adminData.globalChat[adminData.globalChat.length - 1].id 
                : null;
            
            const nothingChanged = !forceReload && currentLastId === lastGlobalId && box.children.length > 0;
            if (nothingChanged) return;
            
            lastGlobalId = currentLastId;
            
            box.innerHTML = '';
            adminData.globalChat.forEach(m => {
                let roleClass = '';
                let badge = '';
                let actionsHtml = `<div class="gc-actions">`;
                let editedMark = m.edited ? `<span style="color:#ffb703; font-size:10px;">(Ред. ${m.edited})</span>` : '';
                let replyHtml = '';

                if (m.replyTo) {
                    const parent = adminData.globalChat.find(x => x.id === m.replyTo);
                    if (parent) replyHtml = `<div class="gc-reply-quote"><b>${esc(parent.name)}:</b> ${esc(parent.text)}</div>`;
                }

                if (m.role === 'owner') { roleClass = 'role-owner'; badge = `<span style="background:#ffb703; color:#000; font-size:10px; padding:2px 5px; border-radius:4px;">ВЛАДЕЛЕЦ</span>`; }
                else if (m.role === 'moder') { roleClass = 'role-moder'; badge = `<span style="background:#ff4d4d; color:#fff; font-size:10px; padding:2px 5px; border-radius:4px;">МОДЕР</span>`; }
                else if (m.role === 'tester') { roleClass = 'role-tester'; badge = `<span style="background:#00d2ff; color:#000; font-size:10px; padding:2px 5px; border-radius:4px;">ТЕСТЕР</span>`; }
                else if (m.role === 'system') { roleClass = 'system-msg'; }

                if (m.role !== 'system') {
                    actionsHtml += `<button onclick="copyMsgText('${m.text.replace(/'/g, "\\'")}')" title="Копировать">📋</button>`;
                    actionsHtml += `<button onclick="replyToMessage('${m.id}', '${m.text.replace(/'/g, "\\'")}', '${esc(m.name)}')" title="Ответить">↩️</button>`;
                    if (m.role === 'owner') {
                        actionsHtml += `<button onclick="openEditMsgModal('${m.id}', '${m.text.replace(/'/g, "\\'")}')" title="Редактировать">✏️</button>`;
                    }
                }
                actionsHtml += `</div>`;

                if (m.role === 'system') {
                    box.innerHTML += `
                        <div class="gc-msg ${roleClass}" style="justify-content:center; text-align:center;">
                            <div class="gc-text" style="color:#ff4d4d; font-size:13px;">${esc(m.text)} ${editedMark}</div>
                        </div>
                    `;
                } else {
                    box.innerHTML += `
                        <div class="gc-msg ${roleClass}">
                            ${actionsHtml}
                            ${replyHtml}
                            <div style="flex-grow: 1;">
                                <div class="gc-header-info">
                                    <span class="gc-name">${esc(m.name)} ${badge}</span>
                                    <span>${m.time} ${editedMark}</span>
                                </div>
                                <div class="gc-text">${esc(m.text)}</div>
                            </div>
                            <button class="btn-del-msg" onclick="deleteGlobalMessage('${m.id}')" title="Удалить">×</button>
                        </div>
                    `;
                }
            });
            box.scrollTop = box.scrollHeight;
        }

        async function sendGlobalAdminMsg() {
            const input = document.getElementById('admin-gc-input');
            const text = input.value.trim();
            if (!text) return;
            
            const payload = { text };
            if (replyToId) payload.replyTo = replyToId;
            
            try {
                const res = await fetch('/api/admin/global-chat/send', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                if (!res.ok) { alert('Ошибка отправки: ' + res.status); return; }
                input.value = '';
                cancelReply();
                await loadData();
                renderGlobalAdminChat(true);
            } catch (e) { alert('Ошибка сети: ' + e.message); }
        }

        async function deleteGlobalMessage(msgId) {
            if(!confirm('Удалить это сообщение?')) return;
            try {
                const res = await fetch('/api/admin/global-chat/delete', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ msgId })
                });
                if (!res.ok) alert('Ошибка удаления: ' + res.status);
                await loadData();
                renderGlobalAdminChat(true);
            } catch (e) { alert('Ошибка сети: ' + e.message); }
        }
    </script>
</body>
</html>
